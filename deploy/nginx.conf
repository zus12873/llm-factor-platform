server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # An upload limit at the edge as well as in the application: the application
    # limit protects the parser, this one stops the bytes before they arrive.
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Server-sent events must not be buffered; buffering makes the event
        # stream arrive in one lump at the end, which is indistinguishable from
        # a hung session.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
