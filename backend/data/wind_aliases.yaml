# Wind field aliases — canonical Chinese business term → Wind table.field.
#
# Used by `factor_platform.wind.field_search.FieldSearch`. An exact alias hit
# is returned ahead of BM25 matches with `source_tier="alias"`; everything
# else falls back to lexical BM25 over the generated catalog with
# `source_tier="bm25"`.
#
# Each entry supports:
#   table        Wind table name, lowercase (required)
#   field        Wind field name, lowercase (required)
#   asset_type   stock | index | fund | bond | futures | options (optional)
#   frequency    daily | weekly | monthly | quarterly | yearly (optional)
#   meaning_zh   short Chinese description (optional, surfaces as evidence)
#
# Coverage (per Task 9 brief): OHLC, pre/post (前复权/后复权) adjustment,
# volume, turnover, total / free-float market cap, PE / PB / PS, ROE / ROA,
# revenue, net profit, operating cash flow, announcement date, report period,
# industry, index components, ST, suspension.

aliases:
  # ----- OHLC (daily price bar) -----
  开盘价:
    table: ashareeodprices
    field: s_dq_open
    asset_type: stock
    frequency: daily
    meaning_zh: 开盘价
  最高价:
    table: ashareeodprices
    field: s_dq_high
    asset_type: stock
    frequency: daily
    meaning_zh: 最高价
  最低价:
    table: ashareeodprices
    field: s_dq_low
    asset_type: stock
    frequency: daily
    meaning_zh: 最低价
  收盘价:
    table: ashareeodprices
    field: s_dq_close
    asset_type: stock
    frequency: daily
    meaning_zh: 收盘价

  # ----- Adjusted prices -----
  # Wind convention: S_DQ_ADJCLOSE is the 后复权 (backward-adjusted) close;
